# The league's lines: what the ledger's table "The lines" says, as data for `league decide`
# (league_tools/lines.py). A line is a founder and the bots descended from it. state is main,
# side or closed; without_promotion counts the line's iterations of work in a row without a
# promotion (a side line is closed at two); bots are the bots of the league in the line.
champion = "burstguard"

[[line]]
name = "pounce"
state = "side"
head = "pounce_reach"
strategy = "A counter-puncher with no front and no staging: every castle keeps home what the enemy castles could spare against it (their stock above the reserve the `ori` rules keep), production to 4 then speed to 2 above that reserve, only the neutrals on its own side, and every enemy castle priced exactly at each landing turn up to six, struck by the castles that land together when their spare covers it. Founded in iteration 40 on `ori_like`'s scaffolding with the `ori` line's board helpers."
bots = ["pounce", "pounce_reach"]
without_promotion = 0
note = "a side line since iteration 45, when `burstguard` passed it"

[[line]]
name = "ori"
state = "closed"
head = "fullfeed_unfreeze"
strategy = "The hosted bot's rules as read off its games (production at home first, neutrals priced like attacks, rear castles feeding one front, nothing bought or sent from a castle under attack), with the league's holding, exact strikes and reserves; since iteration 34 one small group kept walking at the enemy's front castle. Founded in iteration 25 on `ori_mimic`'s code."
bots = ["fullfeed_unfreeze"]
without_promotion = 2
note = "closed in iteration 43: two iterations of work in a row without a promotion"

[[line]]
name = "frontline"
state = "closed"
head = ""
strategy = "Production then speed in every castle, rear castles staging at the castle nearest the enemy, strikes from there with a margin. Founded in iteration 7 from a real game's winner; the champions of iterations 7 to 24."
bots = []
without_promotion = 0
note = "closed in iteration 25, when the `ori` founders passed it. Until iteration 38 `safe_hold` took more points from the champion than any other player outside the main line. Its code is in git, as Python and as Go. Head: none: `safe_hold`, its last bot, was deleted in iteration 38 by the cap on retired bots"

[[line]]
name = "batchfront"
state = "closed"
head = "batchfront_keep"
strategy = "Founded in iteration 39 on `safe_hold`'s code (the closed `frontline` line) with what the real opponent of games 471 to 474 did: every castle buys production to 3 first and takes only cheap neutrals until production 4; rear castles feed one front in batches of 12; a neutral is paid by the one or two castles nearest it and sized to hold; strikes from up to three castles timed to land together; no reserve against the strongest enemy castle, no freeze under attack, no harassment."
bots = ["batchfront_keep"]
without_promotion = 2
note = "closed in iteration 43: two iterations of work in a row without a promotion"

[[line]]
name = "landgrab"
state = "side"
head = "landgrab"
strategy = "land first: every castle takes the neutrals that pay back soonest before it buys any production level, the nearest two or three castles paying each together, and attacks only as one strike from every castle landing on one enemy castle on the same turn."
bots = ["landgrab"]
without_promotion = 0
note = "admitted in iteration 43"

[[line]]
name = "burstguard"
state = "main"
head = "burstguard"
strategy = "castles past production 4 buy burst levels before speed; no standing reserve against the enemy's spare: a castle keeps what the strongest enemy castle within 4 turns could land less its growth and its burst, and a castle a landing would take this turn bursts to hold."
bots = ["burstguard"]
without_promotion = 0
note = "the main line since iteration 45"
