[project]
name = "island-battles-rsi-bot"
version = "0.0.0"
description = "Island Battles bots that AI agents write and improve, and the tools that play them against each other"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "island-battles-python>=1.7.0",
]

[project.optional-dependencies]
# A match store in S3 (LEAGUE_STORE=s3://...): league_tools/store.py imports boto3 only then.
store = [
    "boto3>=1.44.9",
]

[project.scripts]
league = "league_tools.cli:main"

[dependency-groups]
dev = [
    "boto3>=1.44.9",
    "pytest>=8.0,<9",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["league_tools"]

[tool.ruff]
extend-exclude = ["*.md", "runs", ".runner"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
# The hosted bot's, the automated iteration's and the Lambda player's modules, which their tests import by name.
extra-paths = ["hosting/lambda", "hosting/rsi", "hosting/players"]
