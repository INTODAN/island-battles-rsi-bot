# The league's checks, on every pull request and on main: the tools' and every
# bot's checks, then every bot plays the others and the game's default bots on
# one map with the headless runner. A bot that fails a turn fails the job.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  league:
    name: League
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The runner is built from the game's source, which the first tournament
      # fetches at the commit that runner.toml names.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: Checks of the tools and of every bot
        run: scripts/check.sh

      - name: The bots play a tournament
        run: uv run --locked league tournament --maps circle --run-id checks --strict

  # An iteration's pull request (a claude/league-iteration-N branch, which the
  # automated iteration and the integrator use) may change only bots, the
  # ledger, the lines, the deployed bot's name and new maps; a run's
  # (claude/league-run-<id>) may only add its candidates, its own files, new
  # maps and new detectors: hosting/rsi/scope.py. Other pull requests pass.
  # Branch protection requires this check, so that a run that read something
  # it shouldn't have can't merge a change to a workflow, a tool or a test.
  scope:
    name: Iteration scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The kind of branch
        id: kind
        env:
          HEAD_REF: ${{ github.head_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          kind=""
          if [ "$EVENT" = pull_request ]; then
            case "$HEAD_REF" in
              claude/league-iteration-*) kind=iteration ;;
              claude/league-run-*) kind=run ;;
              claude/league-curator-*) kind=curator ;;
            esac
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          [ -n "$kind" ] || echo "not an iteration's, a run's or the curator's pull request"
      - uses: actions/checkout@v5
        if: steps.kind.outputs.kind != ''
        with:
          fetch-depth: 0
      - name: The branch changes only what its kind may change
        if: steps.kind.outputs.kind != ''
        env:
          KIND: ${{ steps.kind.outputs.kind }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 hosting/rsi/scope.py "origin/$BASE_REF" HEAD --kind "$KIND"
